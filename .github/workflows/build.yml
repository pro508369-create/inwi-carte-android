name: Fabriquer APK inwi Cockpit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Construire APK
        run: gradle assembleDebug --no-daemon
      - name: Lire la version
        id: version
        run: echo "nom=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "inwi-cockpit-${{ steps.version.outputs.nom }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inwi-Cockpit-apk
          path: inwi-cockpit-${{ steps.version.outputs.nom }}.apk
          retention-days: 7
      # Publication pour la mise à jour en un clic : l'appli lit la dernière « release » du dépôt
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.nom }}
          name: inwi Cockpit ${{ steps.version.outputs.nom }}
          files: inwi-cockpit-${{ steps.version.outputs.nom }}.apk
          make_latest: true
