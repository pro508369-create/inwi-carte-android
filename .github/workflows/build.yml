name: Build Inwi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier le SDK Android
        run: |
          echo "SDK Android : $ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Accepter les licences Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Installer les composants Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler APK
        run: gradle assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Inwi-Carte-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
